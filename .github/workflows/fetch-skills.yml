name: Fetch skills

# Daily full scrape. This scheduled run is also the canary against the real
# API: it fails loudly if auth, response shapes or dataset invariants drift.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency: skills-fetch

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Full scrape: ~20 skills.sh list requests, done in about a minute.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Deterministic, secret-free tests must pass before touching the API.
      - name: Offline tests
        run: npm test

      # The Vercel OIDC token expires every ~12h, so it cannot be stored as a
      # secret. Instead, mint a fresh one here from the long-lived VERCEL_TOKEN
      # by linking the project and pulling the development env.
      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Mint Vercel OIDC token
        run: npx vercel@latest env pull .env.local
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # `vercel env pull` appends .env.local to .gitignore when it isn't listed
      # yet; that dirty file would abort publish.mjs's `git checkout -B dist`.
      # Reset it so the publish step starts from a clean worktree.
      - name: Reset .gitignore
        run: git checkout -- .gitignore

      # Every artifact is rebuilt from scratch each run; nothing is restored.
      - name: Scrape all skills
        run: node scraper.mjs

      # Dataset invariants gate the publish.
      - name: Verify dataset
        run: node verify.mjs

      # Data is published to the dist branch as a single parentless (orphan)
      # commit holding exactly the snapshot at the branch root: README.md (the
      # landing page, with this run's stats), skills.jsonl, trending.json and
      # curated.jsonl. dist always serves the newest snapshot; the dist-<date>
      # tags pin a day, bounded to the newest 30 (publish.mjs's default
      # --window, so about a month). The mechanics live in publish.mjs so
      # tests can exercise them offline.
      - name: Publish to dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node publish.mjs
