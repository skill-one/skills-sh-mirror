name: Fetch skills

# Daily full scrape. This scheduled run is also the canary against the real
# API: it fails loudly if auth, response shapes or dataset invariants drift.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency: skills-fetch

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Full scrape (~8.4k skills.sh requests + ~1.2k GitHub star requests, 30-45 min).
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Layer 1: deterministic, secret-free tests must pass before touching the API.
      - name: Offline tests
        run: npm test

      # The Vercel OIDC token expires every ~12h, so it cannot be stored as a
      # secret. Instead, mint a fresh one here from the long-lived VERCEL_TOKEN
      # by linking the project and pulling the development env.
      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Mint Vercel OIDC token
        run: npx vercel@latest env pull .env.local
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # `vercel env pull` appends .env.local to .gitignore when it isn't listed
      # yet; that dirty file would abort publish.mjs's `git checkout -B dist`.
      # Reset it so the publish step starts from a clean worktree.
      - name: Reset .gitignore
        run: git checkout -- .gitignore

      # Seed the scraper with the previous snapshot: the upstream hashes in
      # its skills.jsonl pin fetchedAt, reuse unchanged audit results, keep
      # the last good content of failed fetches, and make the changed/added/
      # removed counters describe this run instead of the empty workspace.
      # No-op on the very first run (no dist branch yet).
      - name: Restore previous snapshot
        run: |
          if git fetch -q origin dist; then
            mkdir -p data
            git archive origin/dist -- skills skills.jsonl stats.json | tar -x -C data
          fi

      - name: Scrape all skills
        run: node scraper.mjs
        env:
          # The built-in GITHUB_TOKEN is capped at 1,000 req/hr per repository —
          # the star phase needs ~1.2k. GH_TOKEN is a repo secret holding the
          # same kind of PAT used locally, mapped to the GITHUB_TOKEN env var
          # the scraper reads (secret names may not start with GITHUB_).
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # Layer 2: dataset invariants gate the publish.
      - name: Verify dataset
        run: node verify.mjs

      # Data is published to the dist branch: one commit per day, history
      # pruned to the newest 30 commits (publish.mjs's default --window, so
      # about a month of snapshots), each retained snapshot tagged
      # dist-<date>. The mechanics live in publish.mjs so tests can exercise
      # them offline; the snapshot sits at the branch root: skills/,
      # skills.jsonl, trending.json, curated.json, stats.json and latest
      # (a one-line pointer holding the snapshot's own tag).
      - name: Publish to dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node publish.mjs
