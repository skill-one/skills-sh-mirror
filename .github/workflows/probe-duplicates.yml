name: Probe duplicates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Mint Vercel OIDC token
        run: npx vercel@latest env pull .env.local
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Probe API for duplicate flags
        run: |
          node - <<'NODE'
          import { readFile } from "node:fs/promises";
          const env = await readFile(".env.local", "utf8");
          const token = env.split("\n").find(l => l.startsWith("VERCEL_OIDC_TOKEN=")).slice(19).trim().replace(/^["']|["']$/g, "");
          const api = async (p) => (await fetch(`https://skills.sh${p}`, { headers: { Authorization: `Bearer ${token}` } })).json();
          let total = 0, dups = 0, keys = null, dupEx = [];
          for (let page = 0; ; page++) {
            const { data, pagination } = await api(`/api/v1/skills?per_page=500&page=${page}`);
            for (const s of data ?? []) {
              total++;
              if (keys === null) keys = Object.keys(s).sort();
              if (s.isDuplicate) { dups++; if (dupEx.length < 5) dupEx.push(s.id); }
            }
            if (!pagination.hasMore || !data?.length) break;
          }
          console.log(JSON.stringify({ total, dups, dupEx, firstRowKeys: keys }, null, 2));
          NODE
